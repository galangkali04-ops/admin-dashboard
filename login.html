<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login · Santai Recovery Spa</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg, #0d1117);
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface, #161b22);
      border: 1px solid var(--border, #21262d);
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px -20px rgba(0,0,0,.6);
    }
    .login-logo {
      display: block;
      max-height: 90px;
      max-width: 220px;
      width: auto;
      height: auto;
      object-fit: contain;
      margin: 0 auto 18px;
    }
    .login-sub {
      text-align: center;
      color: var(--muted, #7d8590);
      font-size: 12px;
      margin: 0 0 26px;
    }
    .login-field { margin-bottom: 16px; }
    .login-field label {
      display: block;
      font-size: 12px;
      color: var(--muted, #7d8590);
      margin-bottom: 6px;
    }
    .login-field input {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface2, #1c2330);
      border: 1px solid var(--border, #21262d);
      color: var(--text, #e6edf3);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
    }
    .login-field input:focus {
      outline: none;
      border-color: var(--gold, #d4a84b);
    }
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 40px;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted, #7d8590);
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .toggle-password:hover {
      color: var(--gold, #d4a84b);
    }
    .login-btn {
      width: 100%;
      background: var(--gold-dim, #a07830);
      border: 1px solid var(--gold, #d4a84b);
      color: #14100a;
      font-weight: 600;
      border-radius: 8px;
      padding: 11px;
      font-size: 14px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      margin-top: 6px;
      transition: opacity .15s;
    }
    .login-btn:hover { opacity: .9; }
    .login-btn:disabled { opacity: .5; cursor: default; }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -6px 0 16px;
    }
    .remember-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--gold, #d4a84b);
      cursor: pointer;
    }
    .remember-row label {
      font-size: 12.5px;
      color: var(--muted, #7d8590);
      cursor: pointer;
      user-select: none;
    }
    .login-error {
      color: var(--red, #f85149);
      font-size: 12px;
      text-align: center;
      min-height: 16px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="assets/gambar/TRANSPARANT LOGO.png" alt="Santai Recovery Spa" class="login-logo">
    <p class="login-sub">Admin Dashboard Login</p>

    <form id="loginForm">
      <div class="login-field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan password" title="Tampilkan password">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember me for 30 days</label>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Login</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
